name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more where they need it.
permissions:
  contents: read

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  secret-scan:
    runs-on: ubuntu-latest
    # On pull_request events gitleaks lists the PR's commits via the API, which
    # needs pull-requests: read. Without it the action dies on a 403 ("Resource
    # not accessible by integration") — it passed on push and only failed once
    # the repo got its first PR.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  # The portable crate runs on Linux; the Tauri desktop crate cannot build here
  # at all (its build script requires the macOS-only maman-observer sidecar for
  # the host triple), so it gets its own macOS job below.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Run Rust tests (browser host)
        run: bash scripts/test-rust.sh browser-host

  rust-desktop:
    # macOS, because the Tauri crate links the platform webview stack and its
    # build script needs the staged Swift observer binary. On Linux it failed at
    # "resource path binaries/maman-observer-x86_64-unknown-linux-gnu doesn't
    # exist" — before that, at glib-2.0 — so these tests had never run in CI.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Build + stage the observer sidecar (required by the Tauri build script)
        run: bash scripts/build-observer.sh
      - name: Run Rust tests (desktop crate)
        run: bash scripts/test-rust.sh desktop

  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Observer no-network / no-keystroke scan
        run: bash scripts/scan-observer-no-network.sh
      - name: Run Swift tests
        run: bash scripts/test-swift.sh
