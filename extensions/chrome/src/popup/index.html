<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Maman Observer</title>
    <style>
      body {
        font-family: -apple-system, "SF Pro Text", Inter, sans-serif;
        width: 320px;
        margin: 0;
        padding: 16px;
        color: #20242a;
        background: #faf8f4;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #667085;
        margin: 4px 0;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #e7e2da;
        border-radius: 8px;
        font-size: 12px;
        margin: 6px 0;
      }
      button {
        background: #4f46e5;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: #20242a;
        border: 1px solid #e7e2da;
      }
      .ok {
        color: #0f9f8f;
      }
      .err {
        color: #dc5a5a;
      }
      ul {
        padding-left: 16px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Maman Observer</h1>
    <div id="pairing">
      <p>Paste the pairing token shown in Maman's Settings panel:</p>
      <input id="token" placeholder="one-time pairing token" autocomplete="off" />
      <button id="pair">Pair with Maman</button>
      <p id="pair-status"></p>
    </div>
    <div id="domains" hidden>
      <p class="ok">Paired with Maman on this Mac.</p>
      <p>Observe the current site (asks Chrome for permission to this domain only):</p>
      <button id="enable-current">Observe this site</button>
      <p>Currently observed:</p>
      <ul id="enabled-list"></ul>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
