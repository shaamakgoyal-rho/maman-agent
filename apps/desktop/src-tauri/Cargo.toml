[package]
name = "maman-desktop"
version = "0.1.0"
description = "Maman — a desktop pet that notices repetitive work and builds safe helpers for you."
edition = "2021"
license = "UNLICENSED"

[lib]
name = "maman_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["sync", "time", "process", "io-util"] }
keyring = { version = "3", features = ["apple-native"] }
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
thiserror = "2"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Schedule triggers: cron parsing + IANA timezones. Versions taken from the
# crates.io resolver on 2026-08-18; every release is past the 3-day cooldown
# (croner 3.0.1 2025-10-27, chrono 0.4.45 2026-06-04, chrono-tz 0.10.4
# 2025-07-11). Cargo has no cooldown config key, so the age check is manual
# and the committed Cargo.lock pins the resolution.
croner = "3.0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
